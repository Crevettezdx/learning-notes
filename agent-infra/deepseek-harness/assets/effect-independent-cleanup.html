<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>撤销 A 时，保留 B 的登记</title><style>body{margin:0;background:#f7f9fb}main{max-width:1120px;margin:0 auto}svg{display:block;width:100%;height:auto}</style><main><svg xmlns="http://www.w3.org/2000/svg" width="1120" height="808" viewBox="0 0 1120 808" role="img" aria-labelledby="effect-independent-cleanup-title effect-independent-cleanup-desc">
<title id="effect-independent-cleanup-title">撤销 A 时，保留 B 的登记</title><desc id="effect-independent-cleanup-desc">A 插件先登记 todo_write，B 插件随后登记工具 B。停用 A 时只移除 todo_write 会保留 B；若恢复 A 登记前的整张旧表，B 后来添加的登记也会丢失。B 为教学示例。</desc><defs><marker id="effect-independent-cleanup-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#62798c"/></marker><marker id="effect-independent-cleanup-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#b45e27"/></marker><marker id="effect-independent-cleanup-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3973ad"/></marker></defs><rect width="1120" height="808" fill="#f7f9fb"/><text x="40" y="48" font-family="PingFang SC,Arial,sans-serif" font-size="28" font-weight="700" fill="#1c3344" text-anchor="start">撤销 A 时，保留 B 的登记</text><text x="40" y="88" font-family="PingFang SC,Arial,sans-serif" font-size="20" font-weight="400" fill="#62798c" text-anchor="start">A = tool-todo；B = 另一个插件（示意）</text><path d="M280 244 L432 244" fill="none" stroke="#3973ad" stroke-width="3"/><polygon points="432,244 420,236 420,252" fill="#3973ad"/><rect x="284" y="200" width="144" height="32" fill="#f7f9fb"/><text x="356" y="224" font-family="PingFang SC,Arial,sans-serif" font-size="20" font-weight="500" fill="#3973ad" text-anchor="middle">＋ todo_write</text><path d="M680 244 L832 244" fill="none" stroke="#b45e27" stroke-width="3"/><polygon points="832,244 820,236 820,252" fill="#b45e27"/><rect x="692" y="200" width="128" height="32" fill="#f7f9fb"/><text x="756" y="224" font-family="PingFang SC,Arial,sans-serif" font-size="20" font-weight="500" fill="#b45e27" text-anchor="middle">＋ 工具 B</text><path d="M888 356 V424 Q888 432 880 432 H568 Q560 432 560 440 V524" fill="none" stroke="#35745b" stroke-width="3"/><polygon points="560,524 552,512 568,512" fill="#35745b"/><path d="M1000 356 L1000 524" fill="none" stroke="#aa4c43" stroke-width="3"/><polygon points="1000,524 992,512 1008,512" fill="#aa4c43"/><rect x="568" y="388" width="224" height="32" fill="#f7f9fb"/><text x="680" y="412" font-family="PingFang SC,Arial,sans-serif" font-size="20" font-weight="500" fill="#35745b" text-anchor="middle">只移除 todo_write</text><rect x="824" y="444" width="160" height="60" fill="#f7f9fb"/><text x="984" y="468" font-family="PingFang SC,Arial,sans-serif" font-size="20" font-weight="500" fill="#aa4c43" text-anchor="end">恢复整张旧表</text><text x="984" y="496" font-family="PingFang SC,Arial,sans-serif" font-size="20" font-weight="400" fill="#aa4c43" text-anchor="end">（A 登记前）</text><rect x="40" y="132" width="240" height="224" rx="8" fill="white" stroke="#b9cbd9" stroke-width="2"/><text x="160" y="168" font-family="PingFang SC,Arial,sans-serif" font-size="24" font-weight="700" fill="#1c3344" text-anchor="middle">起初</text><rect x="56" y="192" width="208" height="36" rx="4" fill="#eef2f5" stroke="#d8e2eb" stroke-width="2"/><text x="160.0" y="216" font-family="PingFang SC,Arial,sans-serif" font-size="20" font-weight="500" fill="#62798c" text-anchor="middle">已有工具</text><rect x="440" y="132" width="240" height="224" rx="8" fill="white" stroke="#b9cbd9" stroke-width="2"/><text x="560" y="168" font-family="PingFang SC,Arial,sans-serif" font-size="24" font-weight="700" fill="#1c3344" text-anchor="middle">① A 登记后</text><rect x="456" y="192" width="208" height="36" rx="4" fill="#eef2f5" stroke="#d8e2eb" stroke-width="2"/><text x="560.0" y="216" font-family="PingFang SC,Arial,sans-serif" font-size="20" font-weight="500" fill="#62798c" text-anchor="middle">已有工具</text><rect x="456" y="240" width="208" height="36" rx="4" fill="#eaf2fb" stroke="#94b8db" stroke-width="2"/><text x="560.0" y="264" font-family="PingFang SC,Arial,sans-serif" font-size="20" font-weight="500" fill="#3973ad" text-anchor="middle">todo_write</text><rect x="840" y="132" width="240" height="224" rx="8" fill="white" stroke=
