<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 1000" role="img" aria-labelledby="mem-cost-title mem-cost-desc">
  <title id="mem-cost-title">未优化时，重复页与冷页共同占用宿主内存</title>
  <desc id="mem-cost-desc">沿用上一篇图中同一节点的 microVM A 和 B，以及 A 的可写 ext4 磁盘。若只读层不使用 virtio-pmem DAX，宿主镜像页缓存之外，A 和 B 的 Guest 页缓存还各持有相同的 Base、Toolkit 文件页；若不回收及上报空闲页，A 的 ext4 冷文件页仍占用 Guest RAM 对应的宿主物理内存。下方显示只读 EROFS 与可写 OverlayBD 仍来自 3FS。</desc>
  <defs>
    <marker id="mem-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0,0 10,4 0,8" fill="#8495a6"/></marker>
    <marker id="mem-arrow-blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0,0 10,4 0,8" fill="#557eaa"/></marker>
  </defs>
  <rect width="1700" height="1000" fill="#f6f7f9"/>
  <text x="56" y="62" fill="#263445" font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif" font-size="34" font-weight="700">未优化时，重复页与冷页共同占用宿主内存</text>
  <text x="56" y="102" fill="#60738a" font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif" font-size="19">承接第五篇 microVM 图 · 本图是假设关闭本篇两项内存优化后的对照情形</text>

  <!-- One host, split into the same two disk paths as the previous figure. -->
  <rect x="56" y="148" width="1588" height="650" rx="10" fill="#fff" stroke="#c7d2de" stroke-width="2"/>
  <text x="80" y="188" fill="#263445" font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif" font-size="22" font-weight="700">同一工作节点 · Guest RAM 最终占用宿主物理内存</text>
  <rect x="80" y="216" width="1010" height="558" rx="8" fill="#f9fbfd" stroke="#d2dde8" stroke-width="1.5"/>
  <rect x="1114" y="216" width="506" height="558" rx="8" fill="#f9fbfd" stroke="#d2dde8" stroke-width="1.5"/>
  <text x="104" y="256" fill="#9f493e" font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif" font-size="22" font-weight="700">① 同一只读文件页在 A、B 的 Guest RAM 中各占一份</text>
  <text x="1138" y="256" fill="#9f493e" font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif" font-size="22" font-weight="700">② 可写盘冷页仍占 RAM</text>

  <!-- Remote storage and file-read arrows are painted behind the guests. -->
  <path d="M 585 852 V 756" fill="none" stroke="#8495a6" stroke-width="2.5" marker-end="url(#mem-arrow)"/>
  <path d="M 340 690 V 664" fill="none" stroke="#8495a6" stroke-width="2.5" marker-end="url(#mem-arrow)"/>
  <path d="M 830 690 V 664" fill="none" stroke="#8495a6" stroke-width="2.5" marker-end="url(#mem-arrow)"/>
  <path d="M 1368 852 V 664" fill="none" stroke="#8495a6" stroke-width="2.5" marker-end="url(#mem-arrow)"/>
  <path d="M 332 540 V 514" fill="none" stroke="#557eaa" stroke-width="2.5" marker-end="url(#mem-arrow-blue)"/>
  <path d="M 822 540 V 514" fill="none" stroke="#557eaa" stroke-width="2.5" marker-end="url(#mem-arrow-blue)"/>
  <path d="M 1368 540 V 514" fill="none" stroke="#557eaa" stroke-width="2.5" marker-end="url(#mem-arrow-blue)"/>

  <!-- Two distinct guests, keeping the layout of the fifth note. -->
  <rect x="104" y="284" width="470" height="380" rx="8" fill="#fff" stroke="#a9bfd4" stroke-width="1.8"/>
  <rect x="594" y="284" width="470" height="380" rx="8" fill="#fff" stroke="#a9bfd4" stroke-width="1.8"/>
  <text x="128" y="324" fill="#234a71" font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif" font-size="22" font-weight="700">microVM A · 只读层</text>
  <text x="618" y="324" fill="#234a71" font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif" font-size="22" font-weight="700">microVM B · 只读层</text>
  <rect x="128" y="348" width="422" height="166" rx="6" fill="#fff4f1" stroke="#ca7869" stroke-width="1.8"/>
  <rect x="618" y="348" width="422" height="166" rx="6" fill="#fff4f1" stroke="#ca7869" stroke-width="1.8"/>
  <text x="152" y="384" fill="#263445" font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif" font-size="20" font-weight="700">Guest 页缓存</text>
  <text x="642" y="384" fill="#263445" font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif" font-size="20" font-weight="700">Guest 页缓存</text>
  <text x="152" y="408" fill="#60738a" font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif" font-size="16">相同文件页的 A 副本</text>
  <text x="642" y="408" fill="#60738a" font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif" font-size="16">相同文件页的 B 副本</text>
  <rect x="152" y="432" width="116" height="54" rx="4" fill="#e7b4aa" stroke="#b96659"/>
  <rect x="280" y="432" width="116" height="54" rx="4" fill="#e7b4aa" stroke="#b96659"/>
  <rect x="642" y="432" width="116" height="54" rx="4" fill="#e7b4aa" stroke="#b96659"/>
  <rect x="770" y="432" width="116" height="54" rx="4" fill="#e7b4aa" stroke="#b96659"/>
  <text x="210" y="466" fill="#733b34" font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">B1:p</text>
  <text x="338" y="466" fill="#733b34" font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">T1:q</text>
  <text x="700" y="466" fill="#733b34" font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">B1:p</text>
  <text x="828" y="466" fill="#733b34" font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">T1:q</text>
  <rect x="128" y="540" width="422" height="94" rx="6" fill="#edf3f9" stroke="#8aaccb" stroke-width="1.6"/>
  <rect x="618" y="540" width="422" height="94" rx="6" fill="#edf3f9" stroke="#8aaccb" stroke-width="1.6"/>
  <text x="339" y="580" fill="#234a71" font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">Guest EROFS</text>
  <text x="339" y="606" fill="#60738a" font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif" font-size="16" text-anchor="middle">Base B1、Toolkit T1 分别挂载</text>
  <text x="829" y="580" fill="#234a71" font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">Guest EROFS</text>
  <text x="829" y="606" fill="#60738a" font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif" font-size="16" text-anchor="middle">Base B1、Toolkit T1 分别挂载</text>
  <rect x="128" y="690" width="914" height="64" rx="6" fill="#edf3f9" stroke="#8aaccb" stroke-width="1.6"/>
  <text x="585" y="718" fill="#234a71" font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">宿主镜像页缓存 · B1:p / T1:q</text>
  <text x="585" y="742" fill="#60738a" font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif" font-size="16" text-anchor="middle">在这份宿主页面之外，上方 A、B 又各缓存了一份相同内容</text>

  <!-- Writable-disk close-up of A, not a third microVM. -->
  <rect x="1138" y="284" width="458" height="380" rx="8" fill="#fff" stroke="#a9bfd4" stroke-width="1.8"/>
  <text x="1162" y="324" fill="#234a71" font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif" font-size="22" font-weight="700">microVM A · 可写盘局部</text>
  <rect x="1162" y="348" width="410" height="166" rx="6" fill="#fff4f1" stroke="#ca7869" stroke-width="1.8"/>
  <text x="1186" y="384" fill="#263445" font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif" font-size="20" font-weight="700">Guest 页缓存</text>
  <text x="1186" y="408" fill="#60738a" font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif" font-size="16">不再访问的文件页仍留在内存</text>
  <rect x="1186" y="432" width="82" height="54" rx="4" fill="#dce8f3" stroke="#8aaccb"/>
  <rect x="1280" y="432" width="82" height="54" rx="4" fill="#e7b4aa" stroke="#b96659"/>
  <rect x="1374" y="432" width="82" height="54" rx="4" fill="#e7b4aa" stroke="#b96659"/>
  <rect x="1468" y="432" width="82" height="54" rx="4" fill="#e7b4aa" stroke="#b96659"/>
  <text x="1227" y="466" fill="#234a71" font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">热页</text>
  <text x="1321" y="466" fill="#733b34" font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">冷页</text>
  <text x="1415" y="466" fill="#733b34" font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">冷页</text>
  <text x="1509" y="466" fill="#733b34" font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">冷页</text>
  <rect x="1162" y="540" width="410" height="94" rx="6" fill="#edf3f9" stroke="#8aaccb" stroke-width="1.6"/>
  <text x="1367" y="580" fill="#234a71" font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">Guest ext4 · virtio-blk</text>
  <text x="1367" y="606" fill="#60738a" font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif" font-size="16" text-anchor="middle">可写磁盘的普通缓存读取路径</text>
  <rect x="1184" y="700" width="364" height="46" rx="4" fill="#fff4f1" stroke="#ca7869" stroke-width="1.4"/>
  <text x="1366" y="729" fill="#9f493e" font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">未回收、未回报的冷页仍占宿主 RAM</text>

  <!-- Remote images are not themselves the host-RAM overhead. -->
  <rect x="104" y="852" width="962" height="104" rx="6" fill="#f3f5f7" stroke="#8799aa" stroke-width="1.5"/>
  <text x="128" y="884" fill="#60738a" font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif" font-size="16" font-weight="700">3FS · 远端只读镜像</text>
  <rect x="128" y="900" width="438" height="36" rx="4" fill="#fff" stroke="#a9b8c7"/>
  <rect x="590" y="900" width="438" height="36" rx="4" fill="#fff" stroke="#a9b8c7"/>
  <text x="347" y="925" fill="#263445" font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Base B1 EROFS</text>
  <text x="809" y="925" fill="#263445" font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Toolkit T1 EROFS</text>
  <rect x="1138" y="852" width="458" height="104" rx="6" fill="#f3f5f7" stroke="#8799aa" stroke-width="1.5"/>
  <text x="1162" y="884" fill="#60738a" font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif" font-size="16" font-weight="700">3FS · 远端基础块</text>
  <rect x="1162" y="900" width="410" height="36" rx="4" fill="#fff" stroke="#a9b8c7"/>
  <text x="1367" y="925" fill="#263445" font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">OverlayBD 基础镜像</text>
</svg>
