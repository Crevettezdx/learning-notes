<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="sandbox-backends-title sandbox-backends-desc">
  <title id="sandbox-backends-title">DSec 四种沙箱后端的结构区别</title>
  <desc id="sandbox-backends-desc">四列以一台物理机为底座。FnCall 与容器列的两个容器位于同一个父虚拟机内并共享该虚拟机的 Linux 内核。microVM 和完整虚拟机列各画两个虚拟机实例，每个实例拥有自己的 Guest Kernel 和虚拟机监控器。完整虚拟机还呈现更完整的操作系统服务和图形设备。</desc>
  <defs><style>@import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style></defs>
  <rect width="1280" height="720" fill="#f5f5f5"/>
  <text x="40" y="52" font-family="&#x27;Geist&#x27;, &#x27;Helvetica Neue&#x27;, Arial, &#x27;Hiragino Sans&#x27;, &#x27;Noto Sans CJK SC&#x27;, sans-serif" font-size="28" font-weight="600" fill="#2d3142" text-anchor="start">四种后端：内核由谁共享，环境由谁独占</text>
  <text x="40" y="80" font-family="&#x27;Geist&#x27;, &#x27;Helvetica Neue&#x27;, Arial, &#x27;Hiragino Sans&#x27;, &#x27;Noto Sans CJK SC&#x27;, sans-serif" font-size="16" font-weight="400" fill="#4f5d75" text-anchor="start">每列 1 台 BMS；各示意 2 个运行实例。</text>
