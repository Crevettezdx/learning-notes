<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 700" role="img" aria-labelledby="map-title map-desc"><title id="map-title">DSec 生产负载到平台难题的因果图</title><desc id="map-desc">论文第4节中，批量创建与环境组合多导致准备成本被放大；CPU使用间歇且沙箱状态保持长久，要求安全的资源超分配；镜像总量大、复用少、实际读取比例低，使全量拉镜像代价高。</desc><defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#263445}.title{font-size:29px;font-weight:700}.sub{font-size:15px;fill:#65758a}.head{font-size:18px;font-weight:700}.eyebrow{font-size:13px;font-weight:700;fill:#6682a3}.node{font-size:21px;font-weight:700}.detail{font-size:15px;fill:#5d6b7c}.challenge{font-size:22px;font-weight:700}.foot{font-size:13px;fill:#718094}</style><marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L9 4 L0 8 Z" fill="#567aa4"/></marker></defs><rect width="1360" height="700" fill="#f6f7f9"/><text x="40" y="52" class="title" text-anchor="start">生产负载如何逼出三个平台难题</text><text x="40" y="82" class="sub" text-anchor="start">图中数字只作证据锚点；先看因果关系，机制见论文图 9。</text><text x="60" y="130" class="head" text-anchor="start">生产负载现象</text><text x="944" y="130" class="head" text-anchor="start">平台难题</text><rect x="40" y="153" width="1280" height="148" rx="8" fill="#fff" stroke="#d5dbe3"/><path d="M 828 227 H 914" fill="none" stroke="#567aa4" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="40" y="322" width="1280" height="148" rx="8" fill="#fff" stroke="#d5dbe3"/><path d="M 828 396 H 914" fill="none" stroke="#567aa4" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="40" y="491" width="1280" height="148" rx="8" fill="#fff" stroke="#d5dbe3"/><path d="M 828 565 H 914" fill="none" stroke="#567aa4" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="60" y="173" width="368" height="108" rx="7" fill="#fff" stroke="#c9d1db"/><text x="78" y="196" class="eyebrow" text-anchor="start">图 2 ＋ 正文</text><text x="78" y="231" class="node" text-anchor="start">批量同时创建</text><text x="78" y="260" class="detail" text-anchor="start">单任务最多请求 32K 个沙箱</text><rect x="446" y="173" width="368" height="108" rx="7" fill="#fff" stroke="#c9d1db"/><text x="464" y="196" class="eyebrow" text-anchor="start">表 2</text><text x="464" y="231" class="node" text-anchor="start">环境组合多</text><text x="464" y="260" class="detail" text-anchor="start">Workspace：容器 10.2 万，microVM 5.36 万</text><rect x="60" y="342" width="368" height="108" rx="7" fill="#fff" stroke="#c9d1db"/><text x="78" y="365" class="eyebrow" text-anchor="start">图 3、5</text><text x="78" y="400" class="node" text-anchor="start">CPU 间歇突发</text><text x="78" y="429" class="detail" text-anchor="start">约 90% 平均使用 ≤ 申请 CPU 的 5%</text><rect x="446" y="342" width="368" height="108" rx="7" fill="#fff" stroke="#c9d1db"/><text x="464" y="365" class="eyebrow" text-anchor="start">图 3</text><text x="464" y="400" class="node" text-anchor="start">内存与状态持续保留</text><text x="464" y="429" class="detail" text-anchor="start">CPU 低谷时，内存与会话状态仍在</text><rect x="60" y="511" width="368" height="108" rx="7" fill="#fff" stroke="#c9d1db"/><text x="78" y="534" class="eyebrow" text-anchor="start">表 2、图 8</text><text x="78" y="569" class="node" text-anchor="start">镜像多，复用少</text><text x="78" y="598" class="detail" text-anchor="start">一周活跃 &gt; 130 TB；扇出中位数 3 / 1</text><rect x="446" y="511" width="368" height="108" rx="7" fill="#fff" stroke="#c9d1db"/><text x="464" y="534" class="eyebrow" text-anchor="start">表 3</text><text x="464" y="569" class="node" text-anchor="start">运行只读少量内容</text><text x="464" y="598" class="detail" text-anchor="start">样本镜像仅访问 4.2%–13.3%</text><rect x="944" y="173" width="356" height="108" rx="7" fill="#edf4fa" stroke="#6e91b8"/><text x="962" y="219" class="challenge" text-anchor="start">准备成本被批量放大</text><text x="962" y="253" class="detail" text-anchor="start">重复构建、解压会拖慢启动</text><rect x="944" y="342" width="356" height="108" rx="7" fill="#edf4fa" stroke="#6e91b8"/><text x="962" y="388" class="challenge" text-anchor="start">需要安全地超分配</text><text x="962" y="422" class="detail" text-anchor="start">内存驻留、CPU 干扰不能失控</text><rect x="944" y="511" width="356" height="108" rx="7" fill="#edf4fa" stroke="#6e91b8"/><text x="962" y="557" class="challenge" text-anchor="start">全量拉镜像代价高</text><text x="962" y="591" class="detail" text-anchor="start">缓存难覆盖，还会争夺运行资源</text><text x="42" y="677" class="foot" text-anchor="start">统计范围：Container 与 microVM；镜像扇出表示同一任务内的复用次数。</text></svg>