<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 980" role="img" aria-labelledby="memory-opt-title memory-opt-desc">
  <title id="memory-opt-title">优化后，只读页共享，Guest 冷页归还宿主</title>
  <desc id="memory-opt-desc">同一节点的 microVM A 和 B 分别挂载只读 Base B1 与 Toolkit T1 EROFS。virtio-pmem 与 DAX 使两台 Guest 绕过自己的只读文件页缓存并复用同一份宿主页面。另一侧放大 microVM A 的可写 ext4 磁盘：DAMON 找出并回收冷文件页，Guest 空闲页分配器合并空闲页，virtio-balloon 的 free-page reporting 功能跨 Guest 和宿主边界报告空闲页，宿主释放对应物理内存。</desc>
  <defs>
    <marker id="opt-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0,0 10,4 0,8" fill="#587da3"/></marker>
    <marker id="opt-arrow-muted" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0,0 10,4 0,8" fill="#8799aa"/></marker>
  </defs>
  <rect width="1700" height="980" fill="#f6f7f9"/>
  <text x="56" y="62" fill="#263445" font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif" font-size="34" font-weight="700">优化后，只读页共享，Guest 冷页归还宿主</text>
  <text x="56" y="102" fill="#60738a" font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif" font-size="19">与“未优化”图对齐：左侧仍是 microVM A / B 的只读层，右侧仍是 A 的可写 ext4 磁盘</text>

  <rect x="56" y="148" width="1588" height="780" rx="10" fill="#fff" stroke="#c7d2de" stroke-width="2"/>
  <text x="80" y="188" fill="#263445" font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif" font-size="22" font-weight="700">同一工作节点 · 左侧避免新增 Guest 副本，右侧释放已占用的宿主页</text>
  <rect x="80" y="216" width="1010" height="688" rx="8" fill="#f9fbfd" stroke="#d2dde8" stroke-width="1.5"/>
  <rect x="1114" y="216" width="506" height="688" rx="8" fill="#f9fbfd" stroke="#d2dde8" stroke-width="1.5"/>
  <text x="104" y="256" fill="#234a71" font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif" font-size="22" font-weight="700">① 只读 EROFS：DAX 让 A、B 复用宿主页面</text>
  <text x="1138" y="256" fill="#234a71" font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif" font-size="22" font-weight="700">② 可写 ext4：冷页变空闲，再报告宿主</text>

  <!-- Lines first. Shared host pages supply both guests. -->
  <path d="M 340 770 V 704" fill="none" stroke="#587da3" stroke-width="2.8" marker-end="url(#opt-arrow)"/>
  <path d="M 830 770 V 704" fill="none" stroke="#587da3" stroke-width="2.8" marker-end="url(#opt-arrow)"/>
  <path d="M 332 440 V 462" fill="none" stroke="#8799aa" stroke-width="2.2" stroke-dasharray="5 4"/>
  <path d="M 822 440 V 462" fill="none" stroke="#8799aa" stroke-width="2.2" stroke-dasharray="5 4"/>
  <path d="M 332 544 V 566" fill="none" stroke="#587da3" stroke-width="2.8" marker-end="url(#opt-arrow)"/>
  <path d="M 822 544 V 566" fill="none" stroke="#587da3" stroke-width="2.8" marker-end="url(#opt-arrow)"/>
  <path d="M 1368 442 V 466" fill="none" stroke="#587da3" stroke-width="2.8" marker-end="url(#opt-arrow)"/>
  <path d="M 1368 538 V 562" fill="none" stroke="#587da3" stroke-width="2.8" marker-end="url(#opt-arrow)"/>
  <path d="M 1368 634 V 658" fill="none" stroke="#587da3" stroke-width="2.8" marker-end="url(#opt-arrow)"/>
  <path d="M 1368 730 V 812" fill="none" stroke="#587da3" stroke-width="2.8" marker-end="url(#opt-arrow)"/>

  <!-- Read-only guests. The empty dashed cache is the missing duplicate from the before image. -->
  <rect x="104" y="294" width="470" height="420" rx="8" fill="#fff" stroke="#a9bfd4" stroke-width="1.8"/>
  <rect x="594" y="294" width="470" height="420" rx="8" fill="#fff" stroke="#a9bfd4" stroke-width="1.8"/>
  <text x="128" y="332" fill="#234a71" font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif" font-size="22" font-weight="700">microVM A · 只读层</text>
  <text x="618" y="332" fill="#234a71" font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif" font-size="22" font-weight="700">microVM B · 只读层</text>
  <rect x="128" y="352" width="422" height="88" rx="6" fill="#edf3f9" stroke="#8aaccb" stroke-width="1.6"/>
  <rect x="618" y="352" width="422" height="88" rx="6" fill="#edf3f9" stroke="#8aaccb" stroke-width="1.6"/>
  <text x="339" y="390" fill="#234a71" font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">Guest EROFS</text>
  <text x="339" y="418" fill="#60738a" font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif" font-size="16" text-anchor="middle">B1、T1 分别挂载</text>
  <text x="829" y="390" fill="#234a71" font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">Guest EROFS</text>
  <text x="829" y="418" fill="#60738a" font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif" font-size="16" text-anchor="middle">B1、T1 分别挂载</text>
  <rect x="128" y="466" width="422" height="78" rx="6" fill="#fff" stroke="#b8c7d5" stroke-width="1.6" stroke-dasharray="7 5"/>
  <rect x="618" y="466" width="422" height="78" rx="6" fill="#fff" stroke="#b8c7d5" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text x="339" y="501" fill="#60738a" font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Guest 只读页缓存：跳过</text>
  <text x="339" y="527" fill="#60738a" font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif" font-size="16" text-anchor="middle">不再存放 B1:p、T1:q 副本</text>
  <text x="829" y="501" fill="#60738a" font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Guest 只读页缓存：跳过</text>
  <text x="829" y="527" fill="#60738a" font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif" font-size="16" text-anchor="middle">不再存放 B1:p、T1:q 副本</text>
  <rect x="128" y="570" width="422" height="98" rx="6" fill="#edf3f9" stroke="#6b95bb" stroke-width="1.8"/>
  <rect x="618" y="570" width="422" height="98" rx="6" fill="#edf3f9" stroke="#6b95bb" stroke-width="1.8"/>
  <text x="339" y="610" fill="#234a71" font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">virtio-pmem / DAX</text>
  <text x="339" y="640" fill="#60738a" font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif" font-size="16" text-anchor="middle">直接映射宿主支持的页面</text>
  <text x="829" y="610" fill="#234a71" font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">virtio-pmem / DAX</text>
  <text x="829" y="640" fill="#60738a" font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif" font-size="16" text-anchor="middle">直接映射宿主支持的页面</text>
  <rect x="128" y="770" width="914" height="102" rx="6" fill="#eaf2fa" stroke="#6b95bb" stroke-width="1.8"/>
  <text x="585" y="808" fill="#234a71" font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">宿主共享页面 · 一份 B1:p / T1:q</text>
  <rect x="465" y="824" width="112" height="30" rx="4" fill="#b7d0e7" stroke="#6b95bb"/>
  <rect x="593" y="824" width="112" height="30" rx="4" fill="#b7d0e7" stroke="#6b95bb"/>
  <text x="521" y="845" fill="#234a71" font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">B1:p</text>
  <text x="649" y="845" fill="#234a71" font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">T1:q</text>

  <!-- Writable disk in the same microVM A. The balloon driver is inside Guest; reporting crosses the boundary. -->
  <rect x="1138" y="294" width="458" height="450" rx="8" fill="#fff" stroke="#a9bfd4" stroke-width="1.8"/>
  <text x="1162" y="332" fill="#234a71" font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif" font-size="22" font-weight="700">microVM A · 可写盘局部</text>
  <rect x="1162" y="352" width="410" height="90" rx="6" fill="#edf3f9" stroke="#8aaccb" stroke-width="1.6"/>
  <text x="1367" y="385" fill="#234a71" font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Guest ext4 文件页缓存</text>
  <rect x="1248" y="400" width="62" height="26" rx="3" fill="#b7d0e7" stroke="#6b95bb"/>
  <rect x="1322" y="400" width="62" height="26" rx="3" fill="#e7b4aa" stroke="#b96659"/>
  <rect x="1396" y="400" width="62" height="26" rx="3" fill="#e7b4aa" stroke="#b96659"/>
  <text x="1279" y="418" fill="#234a71" font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">热页</text>
  <text x="1353" y="418" fill="#733b34" font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">冷页</text>
  <text x="1427" y="418" fill="#733b34" font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">冷页</text>
  <rect x="1162" y="466" width="410" height="72" rx="6" fill="#eaf2fa" stroke="#6b95bb" stroke-width="1.6"/>
  <text x="1367" y="495" fill="#234a71" font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">① DAMON · 识别并回收冷文件页</text>
  <text x="1367" y="522" fill="#60738a" font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif" font-size="16" text-anchor="middle">冷页退出 Guest 文件缓存</text>
  <rect x="1162" y="562" width="410" height="72" rx="6" fill="#fff" stroke="#a9bfd4" stroke-width="1.6"/>
  <text x="1367" y="590" fill="#263445" font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">② Guest 空闲页分配器</text>
  <text x="1367" y="618" fill="#60738a" font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif" font-size="16" text-anchor="middle">页变空闲，并合并成可报告的块</text>
  <rect x="1162" y="658" width="410" height="72" rx="6" fill="#eaf2fa" stroke="#6b95bb" stroke-width="1.6"/>
  <text x="1367" y="686" fill="#234a71" font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">③ virtio-balloon · FPR</text>
  <text x="1367" y="714" fill="#60738a" font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif" font-size="16" text-anchor="middle">Guest 驱动报告哪些页已经空闲</text>
  <path d="M 1138 776 H 1596" fill="none" stroke="#9caebe" stroke-width="1.6" stroke-dasharray="7 5"/>
  <rect x="1288" y="762" width="160" height="26" rx="4" fill="#f9fbfd"/>
  <text x="1368" y="781" fill="#60738a" font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">Guest / 宿主边界</text>
  <rect x="1162" y="812" width="410" height="60" rx="6" fill="#eaf2fa" stroke="#6b95bb" stroke-width="1.8"/>
  <text x="1367" y="850" fill="#234a71" font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">④ 宿主释放对应物理页</text>
</svg>
